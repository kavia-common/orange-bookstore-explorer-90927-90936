<?xml version="1.0" encoding="UTF-8"?>
<svg width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Orange Bookstore</title>
  <desc id="logoDesc">Stylized mark with gradient book icon and text Orange Bookstore</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Icon: book shape -->
  <g>
    <rect x="4" y="6" width="28" height="28" rx="6" fill="url(#g1)"/>
    <path d="M10 12h12c2 0 4 1.5 4 3.5v12c-1-1.2-2.5-1.7-4-1.7H10v-13.8z" fill="white" opacity=".9"/>
    <path d="M10 12c0 2 1.6 3.5 3.5 3.5H26" stroke="white" stroke-width="2" stroke-linecap="round" opacity=".9"/>
  </g>
  <!-- Text -->
  <g transform="translate(42,9)">
    <text x="0" y="16" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="800" fill="#111827">Orange</text>
    <text x="66" y="16" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#2563EB">Bookstore</text>
  </g>
</svg>
